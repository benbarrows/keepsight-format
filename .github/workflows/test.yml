name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build; 3.9 runs on 24.04.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I test_keepsight_package.py
